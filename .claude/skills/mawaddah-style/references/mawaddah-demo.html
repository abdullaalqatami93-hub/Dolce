<!doctype html>
<html lang="en">
<head>

<title>Mawaddah Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: one phone sized app column, centered on wide screens, screens swap inside it, tab bar pinned to the bottom of the column. */
:root {
  --page: #FDEFE0;
  --bg: #FBF5EC;
  --card: #FFFFFF;
  --ink: #4A2E5C;
  --ink-soft: #7A6690;
  --line: #F3E8D8;
  --coral: #F27E96;
  --coral-strong: #E45C7B;
  --coral-soft: #FBE3E9;
  --coral-text: #C94468;
  --gold: #F2AE43;
  --gold-soft: #FBEFD9;
  --gold-soft-2: #FFE9C2;
  --gold-text: #A87B1B;
  --teal: #3BBFB2;
  --teal-soft: #DDF4F1;
  --teal-text: #1D8A80;
  --on-strong: #FFFFFF;
  --serif: Georgia, 'Times New Roman', serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --arabic: 'Tajawal', 'Segoe UI', Tahoma, 'Geeza Pro', sans-serif;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #140D1B;
    --bg: #1E1428;
    --card: #2A1D37;
    --ink: #F4EAF8;
    --ink-soft: #B8A7CB;
    --line: #3B2B4A;
    --coral-soft: #4A2634;
    --coral-text: #F59AAF;
    --gold-soft: #3F3219;
    --gold-soft-2: #5A4620;
    --gold-text: #F2C46E;
    --teal-soft: #1B3D3B;
    --teal-text: #6FD6CB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #140D1B;
  --bg: #1E1428;
  --card: #2A1D37;
  --ink: #F4EAF8;
  --ink-soft: #B8A7CB;
  --line: #3B2B4A;
  --coral-soft: #4A2634;
  --coral-text: #F59AAF;
  --gold-soft: #3F3219;
  --gold-soft-2: #5A4620;
  --gold-text: #F2C46E;
  --teal-soft: #1B3D3B;
  --teal-text: #6FD6CB;
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--ink); font-family: var(--sans); }
body[data-lang="ar"] { font-family: var(--arabic); }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.stage { height: 100%; display: flex; justify-content: center; }
.app { position: relative; width: 100%; max-width: 430px; height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.blob { position: absolute; border-radius: 50%; pointer-events: none; }
.blob.a { width: 208px; height: 208px; top: -64px; inset-inline-end: -64px; background: var(--coral-soft); opacity: .8; }
.blob.b { width: 176px; height: 176px; top: 160px; inset-inline-start: -80px; background: var(--teal-soft); opacity: .8; }
.blob.c { width: 144px; height: 144px; bottom: 90px; inset-inline-end: -48px; background: var(--gold-soft); opacity: .9; }

.screen { position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 32px 20px 24px; }
.screen.center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-inline: 32px; }
.serif { font-family: var(--serif); }

h1, h2 { margin: 0; color: var(--ink); text-wrap: balance; }
h1 { font-family: var(--serif); font-size: 48px; line-height: 1.1; margin-top: 20px; }
h2 { font-family: var(--serif); font-size: 24px; line-height: 1.25; }
p { margin: 0; }

.divider { margin-top: 12px; display: flex; align-items: center; gap: 8px; color: var(--coral-text); font-size: 14px; }
.divider i { width: 32px; height: 2px; border-radius: 2px; background: var(--gold); }
.tagline { margin-top: 12px; font-size: 14px; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; }
body[data-lang="ar"] .tagline { letter-spacing: 0; }
.sub { margin-top: 4px; font-size: 14px; color: var(--ink-soft); }
.privacy { margin-top: 40px; font-size: 12px; color: var(--ink-soft); }

.btn-main { margin-top: 40px; padding: 16px 36px; border-radius: 999px; font-size: 16px; font-weight: 700; background: var(--coral-strong); color: var(--on-strong); box-shadow: 0 8px 24px #E45C7B44; transition: transform .15s; }
.btn-main:active { transform: scale(.96); }
.btn-lang { padding: 8px 24px; margin-top: 16px; border-radius: 999px; font-size: 14px; font-weight: 500; border: 2px solid var(--coral-soft); color: var(--coral-text); background: var(--card); }
.btn-lang.small { margin: 0; padding: 6px 12px; font-size: 12px; }

.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.card { margin-top: 16px; padding: 20px; border-radius: 24px; background: var(--card); box-shadow: 0 1px 3px #4A2E5C14; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
body[data-lang="ar"] .label { letter-spacing: 0; }
.pill { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.demo { background: var(--gold-soft); color: var(--gold-text); }
.note { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

.pulse { display: flex; align-items: center; gap: 20px; }
.pulse svg { flex: none; }
.pulse b { display: block; font-size: 14px; color: var(--coral-text); }
.pulse span { display: block; margin-top: 4px; font-size: 14px; color: var(--ink-soft); }
.ring-fill { transition: stroke-dashoffset 1.2s ease; }

.q { margin-top: 8px; font-size: 16px; font-weight: 500; line-height: 1.4; }
.moods { margin-top: 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mood { padding: 12px 4px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--bg); border: 2px solid var(--line); transition: transform .15s, background .15s; }
.mood .e { font-size: 24px; line-height: 1; }
.mood .l { font-size: 10px; font-weight: 500; color: var(--ink-soft); }
.mood[aria-pressed="true"] { background: var(--coral-strong); border-color: var(--coral-strong); transform: scale(1.06); }
.mood[aria-pressed="true"] .l { color: #fff; }
.saved { margin-top: 12px; font-size: 12px; font-weight: 500; color: var(--teal-text); }

.nav-card { width: 100%; margin-top: 12px; padding: 20px; border-radius: 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: start; transition: transform .15s; }
.nav-card:active { transform: scale(.98); }
.nav-card.coach { margin-top: 16px; background: linear-gradient(135deg, var(--coral-strong), #FF8D74); color: #fff; }
.nav-card.coach small { display: block; margin-top: 4px; font-size: 14px; color: #FFE9E5; }
.nav-card.together { background: var(--card); border: 2px solid var(--gold-soft); }
.nav-card.together small { display: block; margin-top: 4px; font-size: 14px; color: var(--ink-soft); }
.nav-card strong { display: block; font-size: 18px; }
.chev { font-size: 24px; line-height: 1; }

.coach-wrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 24px; }
.coach-head { padding-inline: 20px; display: flex; align-items: center; gap: 12px; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 8px; display: flex; flex-direction: column; gap: 12px; }
.brow { display: flex; justify-content: flex-start; }
.brow.me { justify-content: flex-end; }
[dir="rtl"] .brow { justify-content: flex-end; }
[dir="rtl"] .brow.me { justify-content: flex-start; }
.bubble { max-width: 82%; padding: 10px 16px; border-radius: 24px; font-size: 14px; line-height: 1.55; background: var(--card); border: 2px solid var(--line); overflow-wrap: anywhere; white-space: pre-wrap; }
.brow.me .bubble { background: var(--coral-strong); border-color: var(--coral-strong); color: #fff; }
.bubble.dim { color: var(--ink-soft); }
.composer { padding: 12px 16px 12px; display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; padding: 12px 16px; border-radius: 999px; font-size: 14px; background: var(--card); color: var(--ink); border: 2px solid var(--coral-soft); }
.composer input::placeholder { color: var(--ink-soft); }
.composer button { padding: 0 20px; border-radius: 999px; font-size: 14px; font-weight: 700; background: var(--coral-strong); color: #fff; transition: transform .15s; }
.composer button:active { transform: scale(.95); }
.composer button:disabled { opacity: .5; }

.mark-center { margin-top: 16px; display: flex; justify-content: center; }
.insight { margin-top: 12px; padding: 20px; border-radius: 24px; background: linear-gradient(135deg, var(--gold-soft), var(--gold-soft-2)); }
.insight .tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--card); color: var(--gold-text); }
.insight p { margin-top: 12px; font-family: var(--serif); font-size: 16px; font-weight: 500; line-height: 1.6; }
body[data-lang="ar"] .insight p { font-family: var(--arabic); }
.suggest p { margin-top: 8px; font-size: 14px; line-height: 1.6; }
.btn-add { margin-top: 12px; padding: 10px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--coral-strong); color: #fff; transition: transform .15s; }
.btn-add:active { transform: scale(.95); }
.btn-add.done { background: var(--teal-soft); color: var(--teal-text); }

.month { font-size: 14px; font-weight: 700; text-align: center; }
.grid7 { margin-top: 12px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.grid7 .dn { font-size: 10px; font-weight: 700; padding: 4px 0; color: var(--ink-soft); }
.grid7 .d { padding: 6px 0; border-radius: 12px; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.grid7 .d.coral { background: var(--coral-strong); color: #fff; font-weight: 800; }
.grid7 .d.teal { background: #2FA89C; color: #fff; }
.events { margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
.ev { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 24px; background: var(--card); box-shadow: 0 1px 3px #4A2E5C14; }
.ev .ic { flex: none; width: 44px; height: 44px; border-radius: 16px; display: grid; place-items: center; font-size: 20px; }
.ev b { display: block; font-size: 14px; }
.ev span.dd { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-soft); }
.tint-coral { background: var(--coral-soft); color: var(--coral-text); }
.tint-teal { background: var(--teal-soft); color: var(--teal-text); }
.tint-gold { background: var(--gold-soft); color: var(--gold-text); }
.ev .ic { color: inherit; }
.idea { margin-top: 16px; padding: 16px; border-radius: 24px; background: var(--coral-soft); font-size: 12px; line-height: 1.6; font-weight: 500; color: var(--coral-text); }
.section-label { margin-top: 16px; color: var(--gold-text); }

.tabs { position: relative; display: flex; background: var(--card); border-top: 2px solid var(--line); padding-bottom: 0; }
.tab { flex: 1; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 500; color: var(--ink-soft); }
.tab .i { font-size: 18px; line-height: 1.3; }
.tab[aria-current="page"] { color: var(--coral-text); font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  .ring-fill, .btn-main, .mood, .nav-card, .btn-add, .composer button { transition: none; }
}
@media (min-width: 560px) {
  .app { box-shadow: 0 0 0 1px var(--line), 0 24px 60px #4A2E5C22; }
}
</style>
</head>

      consentTag: "شوركت بموافقتكما معاً",
      sharedInsight: "بينكما شيء لطيف هذا الأسبوع: كلاكما تمنّى، بطريقته الخاصة، أمسية هادئة معاً. اعتبرها إشارتك 😉",
      suggestion: "خطوة صغيرة ممتعة",
      suggestionBody: "الخميس يبدو خالياً لكما. مشية عند الغروب، وكرك في طريق العودة، والهواتف صامتة. الطقوس الصغيرة أجمل من اللفتات الكبيرة.",

  var state = { lang: "en", screen: "welcome", mood: null, added: false, messages: [], busy: false, notice: "", ringDone: false };
  var app = document.getElementById("app");

  function heart(x, y, s, fill) {
    return '<path transform="translate(' + x + ' ' + y + ') scale(' + s + ')" fill="' + fill + '" d="M0 3.2 C-0.6 1.6 -2.2 0.6 -3.6 1.2 C-5.2 1.9 -5.8 3.9 -4.9 5.4 C-3.8 7.2 0 10 0 10 C0 10 3.8 7.2 4.9 5.4 C5.8 3.9 5.2 1.9 3.6 1.2 C2.2 0.6 0.6 1.6 0 3.2 Z"/>';

  function ring(value, animate) {

  function homeHTML(t) {

      '<div class="card pulse">' + ring(0.72, !state.ringDone) + '<div><b>' + t.pulseLabel + '</b><span>' + t.pulseNote + '</span></div></div>' +
      '<div class="card"><div class="label" style="color:var(--gold-text)">✨ ' + t.checkinTitle + '</div>' +
      '<div class="q">' + t.checkinQ + '</div><div class="moods">' + moods + '</div>' +
      (state.mood !== null ? '<div class="saved">' + t.checkinDone + '</div>' : '') + '</div>' +
      '<button class="nav-card coach" data-go="coach"><span><strong>💬 ' + t.coachCard + '</strong><small>' + t.coachCardSub + '</small></span><span class="chev">' + chev + '</span></button>' +
      '<button class="nav-card together" data-go="together"><span class="row">' + mark(46) + '<span><strong>' + t.togetherCard + '</strong><small>' + t.togetherCardSub + '</small></span></span><span class="chev" style="color:var(--gold)">' + chev + '</span></button>' +
      '</div>';
  }

  function coachHTML(t) {
    return '<div class="coach-wrap" id="screen">' +
      '<div class="coach-head"><h2 class="grow">💬 ' + t.coachTitle + '</h2><span class="pill demo">' + t.demoTag + '</span></div>' +
      '<div class="msgs" id="msgs" aria-live="polite"></div>' +
      '<div class="composer"><input id="chatInput" type="text" autocomplete="off" placeholder="' + t.coachPlaceholder + '" aria-label="' + t.coachPlaceholder + '"><button id="sendBtn" data-send>' + t.send + '</button></div>' +
      '</div>';
  }

  function togetherHTML(t) {
    return '<div class="screen" id="screen">' +
      '<div class="row"><h2 class="grow">' + t.togetherTitle + '</h2><span class="pill demo">' + t.demoTag + '</span></div>' +
      '<p class="note">' + t.togetherSub + '</p>' +
      '<div class="mark-center">' + mark(140) + '</div>' +
      '<div class="insight"><span class="tag">✅ ' + t.consentTag + '</span><p>' + t.sharedInsight + '</p></div>' +
      '<div class="card suggest"><div class="label" style="color:var(--coral-text)">🎈 ' + t.suggestion + '</div><p>' + t.suggestionBody + '</p>' +
      '<button class="btn-add' + (state.added ? ' done' : '') + '" data-add>' + (state.added ? t.addedToCal : '📅 ' + t.addToCal) + '</button></div>' +
      '</div>';
  }

  function calendarHTML(t) {
    var cells = t.calDays.map(function (d) { return '<div class="dn">' + d + '</div>'; }).join("");
    for (var e = 0; e < 3; e++) cells += '<div></div>';
    for (var day = 1; day <= 31; day++) {
      var cls = day === 16 ? "coral" : day === 24 ? "teal" : "";
      cells += '<div class="d ' + cls + '">' + day + '</div>';
    }
    var events = t.events.map(function (ev) {
      return '<div class="ev"><div class="ic tint-' + ev.tint + '">' + ev.icon + '</div><div class="grow"><b>' + ev.title + '</b><span class="dd">' + ev.d + '</span></div><span class="pill tint-' + ev.tint + '">' + ev.tag + '</span></div>';
    }).join("");
    return '<div class="screen" id="screen">' +
      '<div class="row"><h2 class="grow">' + t.calTitle + '</h2><span class="pill demo">' + t.demoTag + '</span></div>' +
      '<p class="note">' + t.calSub + '</p>' +
      '<div class="card"><div class="month">' + t.calMonth + '</div><div class="grid7">' + cells + '</div></div>' +
      '<div class="label section-label">' + t.upcoming + '</div><div class="events">' + events + '</div>' +
      '<div class="idea">💡 ' + t.planIdea + '</div></div>';
  }

  function welcomeHTML(t) {
    return '<div class="screen center" id="screen">' + mark(130) +
      '<h1>' + t.appName + '</h1>' +
      '<div class="divider"><i></i><span>♥</span><i></i></div>' +
      '<p class="tagline">' + t.tagline + '</p><p class="sub">' + t.sub + '</p>' +
      '<button class="btn-main" data-go="home">' + t.enter + ' 🎉</button>' +
      '<button class="btn-lang" data-lang>' + t.langBtn + '</button>' +
      '<p class="privacy">' + t.privacy + '</p></div>';
  }

  function navHTML(t) {
    var items = [["home", t.nav[0], "🏠"], ["coach", t.nav[1], "💬"], ["together", t.nav[2], "💛"], ["calendar", t.nav[3], "📅"]];
    return '<nav class="tabs" aria-label="Main">' + items.map(function (it) {
      return '<button class="tab" data-go="' + it[0] + '"' + (state.screen === it[0] ? ' aria-current="page"' : '') + '><span class="i">' + it[2] + '</span>' + it[1] + '</button>';
    }).join("") + '</nav>';
  }

  function drawMsgs() {
    var box = document.getElementById("msgs");
    if (!box) return;
    var t = T[state.lang];
    box.textContent = "";
    function add(who, text, dim) {
      var row = document.createElement("div");
      row.className = "brow" + (who === "me" ? " me" : "");
      var b = document.createElement("div");
      b.className = "bubble" + (dim ? " dim" : "");
      b.textContent = text;
      row.appendChild(b);
      box.appendChild(row);
    }
    add("coach", t.coachHello);
    state.messages.forEach(function (m) { add(m.role === "user" ? "me" : "coach", m.content); });
    if (state.busy) add("coach", t.coachThinking, true);
    if (state.notice) add("coach", state.notice === "offline" ? t.coachOffline : t.coachError, true);
    box.scrollTop = box.scrollHeight;
    var btn = document.getElementById("sendBtn");
    if (btn) btn.disabled = state.busy;
  }

  function render() {
    var t = T[state.lang];
    document.documentElement.lang = state.lang;
    document.body.setAttribute("data-lang", state.lang);
    app.dir = t.dir;
    var body = state.screen === "welcome" ? welcomeHTML(t)
      : state.screen === "home" ? homeHTML(t)
      : state.screen === "coach" ? coachHTML(t)
      : state.screen === "together" ? togetherHTML(t)
      : calendarHTML(t);
    app.innerHTML = '<div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>' + body + (state.screen === "welcome" ? "" : navHTML(t));

    if (state.screen === "coach") drawMsgs();
    if (state.screen === "home" && !state.ringDone) {
      state.ringDone = true;
      var rf = document.getElementById("ringFill");
      if (rf) {
        var go = function () { rf.setAttribute("stroke-dashoffset", rf.getAttribute("data-target")); };
        if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) go();
        else requestAnimationFrame(function () { requestAnimationFrame(go); });
      }
    }
  }

  async function send() {
    var input = document.getElementById("chatInput");
    if (!input || state.busy) return;
    var text = input.value.trim();
    if (!text) return;
    state.notice = "";
    state.messages.push({ role: "user", content: text });
    input.value = "";
    state.busy = true;
    drawMsgs();
    try {
      var sample = window.claude && window.claude.use ? await window.claude.use("sample") : null;
      if (!sample) { state.notice = "offline"; return; }
      var transcript = state.messages.map(function (m) { return (m.role === "user" ? "Khalid: " : "Coach: ") + m.content; }).join("\n");
      var prompt = COACH_BRIEF + "\n\nConversation so far:\n" + transcript + "\n\nWrite only the coach's next reply, with no speaker label.";
      var res = await sample(prompt, { cache: false });
      var reply = (res && res.text ? res.text : "").trim();
      if (!reply) throw new Error("empty");
      state.messages.push({ role: "assistant", content: reply });
    } catch (e) {
      state.notice = (e && e.code === "not_granted") ? "offline" : "error";
    } finally {
      state.busy = false;
      drawMsgs();
      var again = document.getElementById("chatInput");
      if (again) again.focus();
    }
  }

  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-go],[data-lang],[data-mood],[data-add],[data-send]");
    if (!el) return;
    if (el.hasAttribute("data-go")) { state.screen = el.getAttribute("data-go"); render(); }
    else if (el.hasAttribute("data-lang")) { state.lang = state.lang === "en" ? "ar" : "en"; render(); }
    else if (el.hasAttribute("data-mood")) { state.mood = Number(el.getAttribute("data-mood")); render(); }
    else if (el.hasAttribute("data-add")) { state.added = true; render(); }
    else if (el.hasAttribute("data-send")) { send(); }
  });
  app.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.isComposing && e.target && e.target.id === "chatInput") { e.preventDefault(); send(); }
  });

  render();
})();
</script>
</body>
</html>
